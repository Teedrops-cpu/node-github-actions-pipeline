name: Node CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test


      - name: Verify secret is available
        env:
          APP_API_KEY: ${{ secrets.APP_API_KEY }}
        run: |
          if [ -z "$APP_API_KEY" ]; then
            echo "APP_API_KEY is missing"
            exit 1
          fi
          echo "APP_API_KEY is set (length: ${#APP_API_KEY})"
